<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F0F11">
<script>
  // Тема до першого рендеру — без спалаху іншої теми
  (function () {
    var t = 'dark';
    try { var s = localStorage.getItem('ritm:theme'); if (s === 'bloom' || s === 'notes') t = s; } catch (e) {}
    document.documentElement.setAttribute('data-theme', t);
    var bg = { bloom: '#F3EDE3', notes: '#FFFFFF' }[t];
    if (bg) document.querySelector('meta[name="theme-color"]').setAttribute('content', bg);
  })();
</script>
<title>Ритм</title>
