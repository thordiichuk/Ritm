<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ритм · Телефон · Звички</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&amp;family=Onest:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#D7FF4F}a:hover{color:#ECFFB0}
.disp{font-family:'Dela Gothic One',sans-serif;font-weight:400}
.ht{border:0;border-radius:26px;padding:16px;text-align:left;font-family:inherit;display:flex;flex-direction:column;justify-content:space-between;min-height:150px;box-sizing:border-box;cursor:pointer}
.ht .n{font-size:15px;font-weight:800;line-height:1.25}
.ht .s{font-size:12px;font-weight:700;margin-top:2px}
.ht .big{font-family:'Dela Gothic One',sans-serif;font-size:40px;line-height:1}
.off{background:#18181C;color:#F4F4F5}
.off .s{color:#A1A1AA}
.nb{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#A1A1AA;text-decoration:none}
.nb.on{background:#D7FF4F;color:#0F0F11}
</style>
<style>body{display:flex;justify-content:center;padding:24px 0;background:#000}</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0F0F11; font-family: Onest, system-ui, sans-serif; color: #F4F4F5; position: relative; overflow: hidden; padding: 56px 20px 0">
<p style="margin: 0; font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: #A1A1AA">Середа, 11 листопада</p>
<div style="display: flex; align-items: flex-end; justify-content: space-between; margin-top: 6px">
<h1 class="disp" style="margin: 0; font-size: 34px; line-height: 1">Звички</h1>
<p class="disp" style="margin: 0; font-size: 34px; line-height: 1; color: #D7FF4F">2<span style="color: #55555E">/5</span></p>
</div>

<div style="display: grid; grid-template-columns: repeat(14, 1fr); gap: 4px; margin-top: 18px" role="img" aria-label="Виконання всіх звичок за 14 днів">
<i style="aspect-ratio: 1; border-radius: 5px; background: #D7FF4F; opacity: .8; display: block"></i><i style="aspect-ratio: 1; border-radius: 5px; background: #D7FF4F; opacity: .6; display: block"></i><i style="aspect-ratio: 1; border-radius: 5px; background: #D7FF4F; opacity: .6; display: block"></i><i style="aspect-ratio: 1; border-radius: 5px; background: #D7FF4F; display: block"></i><i style="aspect-ratio: 1; border-radius: 5px; background: #D7FF4F; opacity: .8; display: block"></i><i style="aspect-ratio: 1; border-radius: 5px; background: #D7FF4F; opacity: .6; display: block"></i><i style="aspect-ratio: 1; border-radius: 5px; background: #D7FF4F; display: block"></i><i style="aspect-ratio: 1; border-radius: 5px; background: #D7FF4F; opacity: .6; display: block"></i><i style="aspect-ratio: 1; border-radius: 5px; background: #D7FF4F; opacity: .8; display: block"></i><i style="aspect-ratio: 1; border-radius: 5px; background: #D7FF4F; opacity: .8; display: block"></i><i style="aspect-ratio: 1; border-radius: 5px; background: #D7FF4F; display: block"></i><i style="aspect-ratio: 1; border-radius: 5px; background: #D7FF4F; opacity: .8; display: block"></i><i style="aspect-ratio: 1; border-radius: 5px; background: #D7FF4F; opacity: .8; display: block"></i><i style="aspect-ratio: 1; border-radius: 5px; border: 2px dashed #D7FF4F; box-sizing: border-box; display: block"></i>
</div>
<p style="margin: 8px 0 0; font-size: 12px; font-weight: 700; color: #A1A1AA">Останні 14 днів · 78% виконано</p>

<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 18px">
<button class="ht" style="background: #FFB38A; color: #0F0F11" aria-pressed="true"><div><div class="n">Зарядка 10 хв</div><div class="s">виконано · 07:10</div></div><div style="display: flex; align-items: flex-end; justify-content: space-between"><span class="big">21</span><span style="font-size: 12px; font-weight: 800">днів<br>поспіль</span></div></button>
<button class="ht" style="background: #7EE6B8; color: #0F0F11" aria-pressed="true"><div><div class="n">Без телефона до 9:00</div><div class="s">виконано</div></div><div style="display: flex; align-items: flex-end; justify-content: space-between"><span class="big">6</span><span style="font-size: 12px; font-weight: 800">днів<br>поспіль</span></div></button>
<button class="ht off" aria-pressed="false" style="grid-column: span 2; min-height: 110px"><div style="display: flex; justify-content: space-between; width: 100%"><div><div class="n">10 000 кроків</div><div class="s">з Health Connect</div></div><span class="big" style="font-size: 30px">6 240</span></div><div style="height: 12px; border-radius: 6px; background: #26262B; width: 100%"><div style="width: 62%; height: 100%; border-radius: 6px; background: #8EC9FF"></div></div></button>
<button class="ht off" aria-pressed="false"><div><div class="n">Читання 30 сторінок</div><div class="s">торкніться, щоб відмітити</div></div><div style="display: flex; align-items: flex-end; justify-content: space-between"><span class="big" style="color: #B9A4FF">12</span><span style="font-size: 12px; font-weight: 800; color: #A1A1AA">серія<br>під загрозою</span></div></button>
<button class="ht off" aria-pressed="false"><div><div class="n">Сон до 23:30</div><div class="s">нагадаю о 22:45</div></div><div style="display: flex; align-items: flex-end; justify-content: space-between"><span class="big" style="color: #55555E">0</span><span style="font-size: 12px; font-weight: 800; color: #A1A1AA">почнімо<br>сьогодні</span></div></button>
</div>

<nav style="position: absolute; left: 20px; right: 20px; bottom: 24px; height: 72px; border-radius: 36px; background: #1E1E23; display: flex; justify-content: space-around; align-items: center; padding: 0 8px" aria-label="Навігація">
<a class="nb" href="#" aria-label="Сьогодні"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg></a>
<a class="nb on" href="#" aria-label="Звички"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M12 3c1 4 5 5 5 10a5 5 0 01-10 0c0-3 2-4 2-6 2 1 3 2 3 4"></path></svg></a>
<a class="nb" href="#" aria-label="Фокус"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="4"></circle></svg></a>
<a class="nb" href="#" aria-label="Статистика"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7"></path></svg></a>
</nav>
</div>
</body>
</html>
