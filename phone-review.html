<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ритм · Телефон · Вечірній підсумок</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&amp;family=Onest:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#D7FF4F}a:hover{color:#ECFFB0}
.disp{font-family:'Dela Gothic One',sans-serif;font-weight:400}
.k{margin:0 0 10px;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#A1A1AA}
.mood{flex:1;border:0;border-radius:18px;min-height:64px;font-family:inherit;font-size:12px;font-weight:800;color:#0F0F11;display:flex;align-items:flex-end;justify-content:center;padding-bottom:10px}
.left{display:flex;align-items:center;gap:10px;background:#18181C;border-radius:18px;padding:12px 14px;font-size:14px;font-weight:700}
.sw{margin-left:auto;font-family:inherit;font-size:12px;font-weight:800;border-radius:999px;padding:0 14px;min-height:36px;border:0}
</style>
<style>body{display:flex;justify-content:center;padding:24px 0;background:#000}</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0F0F11; font-family: Onest, system-ui, sans-serif; color: #F4F4F5; position: relative; overflow: hidden; padding: 56px 20px 0">
<p style="margin: 0; font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: #A1A1AA">21:00 · середа</p>
<h1 class="disp" style="margin: 6px 0 0; font-size: 34px; line-height: 1.05">День<br>закрито</h1>

<div style="display: flex; gap: 22px; margin-top: 18px">
<div><p class="disp" style="margin: 0; font-size: 34px; color: #D7FF4F">7/10</p><p style="margin: 2px 0 0; font-size: 12px; font-weight: 700; color: #A1A1AA">блоків</p></div>
<div><p class="disp" style="margin: 0; font-size: 34px; color: #FFB38A">4/5</p><p style="margin: 2px 0 0; font-size: 12px; font-weight: 700; color: #A1A1AA">звичок</p></div>
<div><p class="disp" style="margin: 0; font-size: 34px; color: #B9A4FF">3г</p><p style="margin: 2px 0 0; font-size: 12px; font-weight: 700; color: #A1A1AA">фокусу</p></div>
</div>

<section style="margin-top: 22px">
<h2 class="k">Як пройшов день?</h2>
<div style="display: flex; gap: 6px; align-items: flex-end" role="radiogroup" aria-label="Настрій">
<button class="mood" role="radio" aria-checked="false" style="background: #3A3A42; color: #F4F4F5">Важко</button>
<button class="mood" role="radio" aria-checked="false" style="background: #FFB38A; min-height: 72px">Так собі</button>
<button class="mood" role="radio" aria-checked="false" style="background: #8EC9FF; min-height: 80px">Норм</button>
<button class="mood" role="radio" aria-checked="true" style="background: #7EE6B8; min-height: 104px; box-shadow: 0 0 0 3px #0F0F11, 0 0 0 5px #7EE6B8">Добре</button>
<button class="mood" role="radio" aria-checked="false" style="background: #D7FF4F; min-height: 88px">Чудово</button>
</div>
</section>

<section style="margin-top: 22px">
<h2 class="k">Незроблене</h2>
<div style="display: flex; flex-direction: column; gap: 6px">
<div class="left">Пошта й дрібні справи<button class="sw" style="background: #D7FF4F; color: #0F0F11">→ завтра</button></div>
<div class="left">Читання 30 сторінок<button class="sw" style="background: #D7FF4F; color: #0F0F11">→ завтра</button></div>
<div class="left">Стоматолог<button class="sw" style="background: #26262B; color: #F4F4F5">у вхідні</button></div>
</div>
</section>

<section style="margin-top: 22px">
<label for="win" class="k" style="display: block">Одна перемога дня</label>
<input id="win" value="Здала звіт і не гортала телефон зранку" style="width: 100%; box-sizing: border-box; font-family: inherit; font-size: 15px; font-weight: 600; border: 0; border-radius: 18px; padding: 0 16px; min-height: 52px; background: #18181C; color: #F4F4F5">
</section>

<button style="position: absolute; left: 20px; right: 20px; bottom: 32px; min-height: 64px; border: 0; border-radius: 32px; background: #D7FF4F; color: #0F0F11; font-family: inherit; font-size: 17px; font-weight: 800">Спланувати завтра →</button>
</div>
</body>
</html>
