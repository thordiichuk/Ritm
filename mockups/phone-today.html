<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ритм · Телефон · Сьогодні</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&amp;family=Onest:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#D7FF4F}a:hover{color:#ECFFB0}
.disp{font-family:'Dela Gothic One',sans-serif;font-weight:400}
.hr{display:grid;grid-template-columns:58px 1fr;gap:10px;align-items:stretch;min-height:58px;border-top:1px solid #222227}
.hr .h{font-family:'Dela Gothic One',sans-serif;font-size:30px;line-height:1;color:#3A3A42;padding-top:12px}
.b{border-radius:16px;padding:10px 14px;margin:5px 0;color:#0F0F11;display:flex;justify-content:space-between;align-items:center;gap:8px}
.b b{font-size:14px;font-weight:800}
.b span{font-size:12px;font-weight:700;opacity:.7}
.nb{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#A1A1AA;text-decoration:none}
.nb.on{background:#D7FF4F;color:#0F0F11}
.dy{flex:1;border:0;background:transparent;font-family:inherit;color:#71717A;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:48px;justify-content:center;border-radius:14px}
.dy small{font-size:11px;font-weight:700}
.dy b{font-family:'Dela Gothic One',sans-serif;font-weight:400;font-size:18px}
</style>
<style>body{display:flex;justify-content:center;padding:24px 0;background:#000}</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0F0F11; font-family: Onest, system-ui, sans-serif; color: #F4F4F5; position: relative; overflow: hidden; padding: 56px 20px 0">
<div style="display: flex; gap: 2px" role="tablist" aria-label="Дні">
<button class="dy"><small>Пн</small><b>9</b></button><button class="dy"><small>Вт</small><b>10</b></button><button class="dy" aria-selected="true" style="background: #F4F4F5; color: #0F0F11"><small>Ср</small><b>11</b></button><button class="dy"><small>Чт</small><b>12</b></button><button class="dy"><small>Пт</small><b>13</b></button><button class="dy"><small>Сб</small><b>14</b></button><button class="dy"><small>Нд</small><b>15</b></button>
</div>

<section style="margin-top: 14px" aria-label="Розклад по годинах">
<div class="hr"><span class="h">12</span><div class="b" style="background: #7EE6B8; opacity: .45"><b>Обід і прогулянка</b><span>готово</span></div></div>
<div class="hr"><span class="h">13</span><div class="b" style="background: #B9A4FF"><b>Англійська: курс + 20 слів</b><span>13–15</span></div></div>
<div class="hr" style="border-top-color: #D7FF4F"><span class="h" style="color: #D7FF4F">14</span>
<div style="background: #D7FF4F; color: #0F0F11; border-radius: 20px; padding: 14px 16px; margin: 6px 0">
<div style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-size: 12px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase">Зараз 14:20</span><span style="font-size: 12px; font-weight: 800">ще 40 хв</span></div>
<p style="margin: 6px 0 12px; font-size: 16px; font-weight: 800">Англійська — сесія 2 з 4</p>
<button style="min-height: 44px; width: 100%; border: 0; border-radius: 22px; background: #0F0F11; color: #D7FF4F; font-family: inherit; font-size: 14px; font-weight: 800">Відкрити таймер</button>
</div></div>
<div class="hr"><span class="h">15</span><div class="b" style="background: #2C2C32; color: #E6E6EA; margin-top: 30px"><b>Пошта й дрібні справи</b><span>15:30</span></div></div>
<div class="hr"><span class="h">16</span><div style="border: 2px dashed #3A3A42; border-radius: 16px; margin: 5px 0; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: #A1A1AA">+ вільна година</div></div>
<div class="hr"><span class="h">17</span><div style="border: 2px dashed #3A3A42; border-radius: 16px; margin: 5px 0; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: #A1A1AA">+ вільна година</div></div>
<div class="hr"><span class="h">18</span><div class="b" style="background: #7EE6B8"><b>Спортзал: ноги + кардіо</b><span>18–19:30</span></div></div>
</section>

<nav style="position: absolute; left: 20px; right: 20px; bottom: 24px; height: 72px; border-radius: 36px; background: #1E1E23; display: flex; justify-content: space-around; align-items: center" aria-label="Навігація">
<a class="nb on" href="#" aria-label="Сьогодні"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg></a>
<a class="nb" href="#" aria-label="Звички"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M12 3c1 4 5 5 5 10a5 5 0 01-10 0c0-3 2-4 2-6 2 1 3 2 3 4"></path></svg></a>
<a class="nb" href="#" aria-label="Додати"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></a>
<a class="nb" href="#" aria-label="Статистика"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7"></path></svg></a>
</nav>
</div>
</body>
</html>
