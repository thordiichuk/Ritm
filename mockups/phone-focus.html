<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ритм · Телефон · Фокус</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&amp;family=Onest:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0F0F11}a:hover{color:#3B4A00}
.disp{font-family:'Dela Gothic One',sans-serif;font-weight:400}
.ctl{width:64px;height:64px;border-radius:50%;border:2px solid #0F0F11;background:transparent;display:flex;align-items:center;justify-content:center}
</style>
<style>body{display:flex;justify-content:center;padding:24px 0;background:#000}</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #D7FF4F; font-family: Onest, system-ui, sans-serif; color: #0F0F11; position: relative; overflow: hidden; padding: 56px 24px 0">
<header style="display: flex; justify-content: space-between; align-items: center">
<button aria-label="Згорнути" style="width: 48px; height: 48px; border-radius: 50%; border: 2px solid #0F0F11; background: transparent; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0F0F11" stroke-width="2.6" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
<span style="font-size: 13px; font-weight: 800; padding: 10px 14px; border-radius: 999px; background: #0F0F11; color: #D7FF4F">Сповіщення вимкнено</span>
</header>

<p style="margin: 44px 0 0; font-size: 12px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase">Фокус · сесія 2 з 4</p>
<h1 style="margin: 8px 0 0; font-size: 24px; font-weight: 800; line-height: 1.25">Англійська: курс + 20 нових слів</h1>

<div class="disp" style="margin-top: 26px; font-size: 168px; line-height: .86; letter-spacing: -.03em" role="timer" aria-label="Залишилось 18 хвилин 42 секунди">18<br>42</div>

<div style="display: flex; gap: 6px; margin-top: 26px" aria-hidden="true">
<span style="flex: 1; height: 14px; border-radius: 7px; background: #0F0F11"></span>
<span style="flex: 1; height: 14px; border-radius: 7px; background: linear-gradient(90deg, #0F0F11 25%, rgba(15,15,17,.15) 25%)"></span>
<span style="flex: 1; height: 14px; border-radius: 7px; background: rgba(15,15,17,.15)"></span>
<span style="flex: 1; height: 14px; border-radius: 7px; background: rgba(15,15,17,.15)"></span>
</div>
<p style="margin: 10px 0 0; font-size: 14px; font-weight: 700">6 хв 18 с минуло · далі перерва 5 хв</p>

<div style="position: absolute; left: 24px; right: 24px; bottom: 40px; display: flex; align-items: center; gap: 14px">
<button class="ctl" aria-label="Скинути"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0F0F11" stroke-width="2.4" aria-hidden="true"><path d="M3 12a9 9 0 109-9 9 9 0 00-6.4 2.6L3 8M3 3v5h5"></path></svg></button>
<button style="flex: 1; min-height: 64px; border-radius: 32px; border: 0; background: #0F0F11; color: #D7FF4F; font-family: inherit; font-size: 17px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 10px"><svg width="20" height="20" viewBox="0 0 24 24" fill="#D7FF4F" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1.5"></rect><rect x="14" y="5" width="4" height="14" rx="1.5"></rect></svg>Пауза</button>
<button class="ctl" aria-label="Пропустити до перерви"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0F0F11" stroke-width="2.4" aria-hidden="true"><path d="M5 5l10 7-10 7zM19 5v14"></path></svg></button>
</div>
</div>
</body>
</html>
